services:
  certificate:
    image: alpine/openssl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -s /certs/nginx.key && test -s /certs/nginx.crt ||
        exec openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /certs/nginx.key -out /certs/nginx.crt
        -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1
    volumes:
      - certificates:/certs
    restart: "no"

  nginx:
    image: nginx:latest
    container_name: zerodaycloud-nginx
    depends_on:
      certificate:
        condition: service_completed_successfully
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - certificates:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    restart: unless-stopped

volumes:
  certificates:
