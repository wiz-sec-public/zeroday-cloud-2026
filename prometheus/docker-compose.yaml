services:
  scrape-fixture:
    build:
      context: ./fixture
    expose:
      - "5000"
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: zerodaycloud-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      - scrape-fixture
    restart: unless-stopped

networks:
  monitoring:
