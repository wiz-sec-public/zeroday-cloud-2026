services:
  vllm:
    image: vllm/vllm-openai-cpu:latest
    container_name: zerodaycloud-vllm
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      VLLM_CPU_KVCACHE_SPACE: ${VLLM_CPU_KVCACHE_SPACE:-1}
      VLLM_CPU_OMP_THREADS_BIND: ${VLLM_CPU_OMP_THREADS_BIND:-nobind}
    command:
      - ${MODEL:-facebook/opt-125m}
      - --dtype
      - float32
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    shm_size: 4gb
    restart: unless-stopped
