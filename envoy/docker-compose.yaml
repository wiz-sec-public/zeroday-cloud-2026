services:
  envoy-vrp:
    build:
      context: .
      pull: true
      no_cache: true
    pull_policy: build
    platform: linux/amd64
    environment:
      ENVOY_EDGE_EXTRA_ARGS: "--log-level info"
      ENVOY_ORIGIN_EXTRA_ARGS: "--log-level info"
    container_name: zerodaycloud-envoy
    ports:
      - "10000:10000"
    mem_limit: 3g
    restart: unless-stopped
