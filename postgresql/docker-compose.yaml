services:
  postgresql:
    image: postgres:latest
    container_name: zerodaycloud-postgresql
    environment:
      POSTGRES_PASSWORD: zerodaycloud1!
      POSTGRES_DEMO_DB: demo
      POSTGRES_DEMO_USER: demo
      POSTGRES_DEMO_PASSWORD: zerodaycloud1!
    volumes:
      - ./init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
